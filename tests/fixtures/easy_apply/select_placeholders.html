<div class="jobs-easy-apply-modal">
  <div>
    <label for="sel-1">Work authorization</label>
    <select id="sel-1">
      <option value="">Select an option</option>
      <option value="yes">Yes, authorized</option>
      <option value="no">No</option>
    </select>
  </div>
  <div>
    <label for="sel-2">Relocation preference</label>
    <select id="sel-2">
      <option value="placeholder">Choose option</option>
      <option value="willing">Willing to relocate</option>
      <option value="not_willing">Not willing</option>
    </select>
  </div>
  <div>
    <label for="sel-3">Notice period</label>
    <select id="sel-3">
      <option value="none">-- select --</option>
      <option value="immediate">Immediate</option>
      <option value="2weeks">2 Weeks</option>
    </select>
  </div>
</div>
