<div class="jobs-easy-apply-modal">
  <h2>Contact Information</h2>
  <div class="form-group">
    <label for="name-field">Full Name</label>
    <input type="text" id="name-field" value="" />
  </div>
  <div class="form-group">
    <label for="email-field">Email address</label>
    <input type="email" id="email-field" value="test@example.com" />
  </div>
  <div class="form-group">
    <label for="phone-field">Mobile Phone Number</label>
    <input type="tel" id="phone-field" value="" />
  </div>
  <div class="form-group">
    <label for="exp-field">Years of Experience</label>
    <input type="number" id="exp-field" value="" />
  </div>
  <div class="form-group">
    <input type="url" placeholder="Portfolio website URL" id="portfolio-field" value="" />
  </div>
  <div class="form-group">
    <label for="summary-field">Summary</label>
    <textarea id="summary-field"></textarea>
  </div>
  <div class="form-group">
    <div role="textbox" contenteditable="true" aria-label="Cover note">Here is my note</div>
  </div>
</div>
