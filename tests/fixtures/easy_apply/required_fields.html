<div class="jobs-easy-apply-modal">
  <h2>Requirements</h2>
  <div>
    <label for="req-native">Native Required Field *</label>
    <input type="text" id="req-native" required value="" />
  </div>
  <div>
    <label for="req-aria">Aria Required Field</label>
    <input type="text" id="req-aria" aria-required="true" value="" />
  </div>
  <div>
    <label for="req-star">Field with Star Label *</label>
    <input type="text" id="req-star" value="" />
  </div>
  <div>
    <label for="opt-field">Optional Field</label>
    <input type="text" id="opt-field" value="" />
  </div>
  <div>
    <label for="req-select">Required Location *</label>
    <select id="req-select" required>
      <option value="">Select an option</option>
      <option value="US">United States</option>
      <option value="EU">Europe</option>
    </select>
  </div>
  <div>
    <label for="req-check">I agree to terms (required)</label>
    <input type="checkbox" id="req-check" required />
  </div>
</div>
