<div class="jobs-easy-apply-modal">
  <fieldset>
    <legend>Are you legally authorized to work in the United States?</legend>
    <div>
      <input type="radio" id="auth-yes" name="auth" value="Yes" />
      <label for="auth-yes">Yes</label>
    </div>
    <div>
      <input type="radio" id="auth-no" name="auth" value="No" />
      <label for="auth-no">No</label>
    </div>
  </fieldset>

  <div role="radiogroup" aria-label="Will you now or in the future require sponsorship?">
    <div role="radio" aria-checked="false" aria-label="Yes">Yes</div>
    <div role="radio" aria-checked="false" aria-label="No">No</div>
  </div>
</div>
