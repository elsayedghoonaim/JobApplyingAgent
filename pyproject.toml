[project]
name = "jobapply"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4,<2.0",
    "langgraph-checkpoint-mongodb>=0.4",
    "langchain-core>=0.3",
    "langsmith>=0.9",
    "playwright>=1.50",
    "motor>=3.6",
    "pymongo>=4.9",
    "httpx>=0.27",
    "markdown>=3.7",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
jobapply = "jobapply.main:main"
jobapply-live = "jobapply.live:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
