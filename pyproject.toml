[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobapply"
version = "0.3.0"
description = "Autonomous LinkedIn Easy Apply workflow powered exclusively by Gemma."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4,<2.0",
    "langgraph-checkpoint-mongodb>=0.4",
    "langchain-core>=0.3",
    "langsmith>=0.9",
    "playwright>=1.50",
    "motor>=3.6",
    "pymongo>=4.9",
    "httpx>=0.27",
    "markdown>=3.7",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "nh3>=0.3.6",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-socket>=0.7.0",
    "ruff>=0.8.0",
    "pyright>=1.1.380",
    "build>=1.2.0",
]

[project.scripts]
jobapply = "jobapply.main:main"
jobapply-live = "jobapply.live:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jobapply"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--disable-socket"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.coverage.run]
source = ["src/jobapply"]
branch = true
