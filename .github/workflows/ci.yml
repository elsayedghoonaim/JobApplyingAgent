name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Windows CI (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      JOBAPPLY_LLM_PROVIDER: openrouter
      JOBAPPLY_LLM_MODEL: stealth/union-alpha
      JOBAPPLY_LLM_BASE_URL: https://openrouter.ai/api/v1
      OPENROUTER_API_KEY: synthetic-ci-openrouter-key
      JOBAPPLY_TELEGRAM_BOT_TOKEN: 123456789:AAASyntheticTokenForTestsOnly
      TELEGRAM_BOT_TOKEN: 123456789:AAASyntheticTokenForTestsOnly
      JOBAPPLY_TELEGRAM_CHAT_ID: "12345"
      TELEGRAM_CHAT_ID: "12345"
      JOBAPPLY_MAX_APPLICATIONS_PER_SESSION: "50"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint check
        run: uv run ruff check .

      - name: Pyright type check
        run: uv run pyright

      - name: Prepare deterministic test fixtures
        shell: powershell
        run: |
          Copy-Item .env.example .env -Force
          New-Item -ItemType Directory -Force outputs | Out-Null

      - name: Pytest suite (offline)
        run: uv run pytest -q

      - name: Build package
        run: uv build

      - name: Test built wheel in clean virtual environment
        shell: powershell
        run: |
          $wheel = (Get-Item dist/*.whl | Select-Object -First 1).FullName
          $venvPath = Join-Path $env:RUNNER_TEMP "clean_wheel_venv"
          python -m venv $venvPath
          & "$venvPath\Scripts\python.exe" -m pip install $wheel
          & "$venvPath\Scripts\python.exe" -c "import jobapply; assert jobapply.__version__ == '0.3.0'; print('jobapply imported successfully version', jobapply.__version__)"
          & "$venvPath\Scripts\jobapply.exe" --help

      - name: CLI import/help smoke test (uv)
        run: |
          uv run python -m jobapply.main --help
          uv run jobapply --help
